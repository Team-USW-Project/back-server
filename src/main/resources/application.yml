server:
  port: 8080
  servlet:
    context-path: /api/${api.version}
    name: uswProject

api:
  version: v1

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_DATABASE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 500
        format_sql: true
        use_sql_comments: true
    open-in-view: false
    show-sql: false

odsay:
  api:
    key: ${ODSAY_API_KEY}
    base-url: https://api.odsay.com/v1/api



logging:
  level:
    # 패키지 경로는 본인 프로젝트에 맞게 수정
    com.uswProject.client.OdsayClient: DEBUG